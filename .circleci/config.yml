version: 2.1

# Builds the AX3000T image on every push and every Friday at 23:00 UTC.
# Only builds of master are published as GitHub releases; other branches
# just keep the images as CircleCI artifacts.
#
# Project environment variables (CircleCI > Project Settings):
#   GITHUB_TOKEN     required for the release upload
#   OPENWRT_VERSION  optional, "snapshot" (default) or e.g. "25.12.5"
#   KEEP_RELEASES    optional, keep only the newest N releases

jobs:
  build-openwrt:
    docker:
      - image: cimg/base:current
    resource_class: medium
    environment:
      GITHUB_REPO: marcoavesani/openwrt_image_build_ax3000t
    steps:
      - checkout
      - run:
          name: Install ImageBuilder dependencies and gh
          command: |
            sudo apt-get update -qq
            sudo apt-get install -y -qq --no-install-recommends \
              build-essential file gawk gettext git libncurses-dev libssl-dev \
              python3 python3-setuptools rsync unzip wget xsltproc zlib1g-dev zstd
            GH_VERSION=2.62.0
            wget -q "https://github.com/cli/cli/releases/download/v${GH_VERSION}/gh_${GH_VERSION}_linux_amd64.tar.gz" -O /tmp/gh.tgz
            sudo tar -xzf /tmp/gh.tgz -C /usr/local --strip-components=1
            gh --version
      - run:
          name: Build and release
          command: |
            if [ "$CIRCLE_BRANCH" != "master" ]; then
              echo "Branch $CIRCLE_BRANCH: building without a release"
              unset GITHUB_TOKEN
            fi
            ./build_ax3000t.sh
      - store_artifacts:
          path: /tmp/openwrt

workflows:
  build-on-push:
    jobs:
      - build-openwrt

  weekly:
    triggers:
      - schedule:
          cron: "0 23 * * 5"
          filters:
            branches:
              only: master
    jobs:
      - build-openwrt
